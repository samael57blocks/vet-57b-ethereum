services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vet57b
      POSTGRES_USER: vet57b
      POSTGRES_PASSWORD: vet57b
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet57b"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  indexer:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://vet57b:vet57b@postgres:5432/vet57b?sslmode=disable
      ETH_WS_URL: ${ETH_WS_URL}
      ETH_HTTP_URL: ${ETH_HTTP_URL}
      VET_REGISTRY_ADDRESS: ${VET_REGISTRY_ADDRESS}
      CONFIRMATIONS: ${CONFIRMATIONS:-12}
      BACKFILL_FROM_BLOCK: ${BACKFILL_FROM_BLOCK:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
